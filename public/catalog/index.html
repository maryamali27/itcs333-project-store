<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Browse and search the Campus Marketplace catalog.">
  <title>Catalog - Campus Marketplace</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="/theme.css" rel="stylesheet">
  <script src="/color-mode.js"></script>
</head>
<body>
  <nav class="navbar navbar-glass sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">Campus Marketplace</a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link active" href="/catalog/" aria-current="page">Catalog</a>
        <button type="button" class="btn icon-btn" data-theme-toggle></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1 class="hero-title">Catalog.</h1>
      <p class="hero-lead">Everything you need for campus, in one place.</p>
    </header>

    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <div class="search-pill mb-4">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input id="search" type="search" class="form-control form-control-lg"
             placeholder="Search products" aria-label="Search products">
    </div>

    <div id="category-chips" class="d-flex flex-wrap justify-content-center gap-2 mb-4"
         role="group" aria-label="Filter by category">
      <button type="button" class="btn chip" data-category="" aria-pressed="true">All</button>
    </div>

    <p id="result-count" class="text-center text-body-secondary mb-4" aria-live="polite"></p>

    <div id="catalog-list" class="row g-4"></div>
  </main>

  <footer class="site-footer">
    <div class="container">Campus Marketplace &middot; ITCS333 group project</div>
  </footer>

  <!-- Product details sheet (native <dialog>: Esc closes it, focus is handled by the browser) -->
  <dialog id="product-sheet" class="sheet" aria-labelledby="sheet-title">
    <form method="dialog" class="d-flex justify-content-end p-3 pb-0">
      <button class="btn icon-btn" aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
    </form>
    <div id="sheet-body" class="px-4 px-md-5 pb-5"></div>
  </dialog>

  <script src="../app.js"></script>
  <script type="module" src="catalog.js"></script>
</body>
</html>
