<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Browse and search the Campus Marketplace catalog.">
  <title>Catalog - Campus Marketplace</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../theme.css" rel="stylesheet">
  <script src="../color-mode.js"></script>
</head>
<body>
  <nav class="navbar navbar-glass sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../">Campus Marketplace</a>
      <div class="d-flex align-items-center gap-2">
        <a class="nav-link active" href="./" aria-current="page">Catalog</a>
        <button type="button" class="btn icon-btn" data-theme-toggle aria-label="Change theme"></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">Catalog</h1>

    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
      <input id="search" type="search" class="form-control search-pill flex-grow-1 w-auto"
             placeholder="Search products" aria-label="Search products">
      <div id="category-chips" class="d-flex flex-wrap gap-2" role="group" aria-label="Filter by category">
        <button type="button" class="btn chip" data-category="" aria-pressed="true">All</button>
      </div>
    </div>

    <h2 class="visually-hidden">Products</h2>
    <p id="result-count" class="text-body-secondary mb-3" aria-live="polite"></p>

    <div id="catalog-list" class="row g-4"></div>
  </main>

  <footer class="site-footer">
    <div class="container">Campus Marketplace &middot; ITCS333 group project</div>
  </footer>

  <!-- Product details sheet (native <dialog>: Esc closes it, focus is handled by the browser) -->
  <dialog id="product-sheet" class="sheet" aria-labelledby="sheet-title">
    <form method="dialog" class="d-flex justify-content-end p-3 pb-0">
      <button type="submit" class="btn-close p-3" aria-label="Close"></button>
    </form>
    <div id="sheet-body" class="px-4 px-md-5 pb-5"></div>
  </dialog>

  <script src="../app.js"></script>
  <script type="module" src="catalog.js"></script>
</body>
</html>
