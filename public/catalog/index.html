<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog - Campus Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar bg-primary mb-4" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="/">Campus Marketplace</a>
      <span class="navbar-text">Catalog</span>
    </div>
  </nav>

  <main class="container">
    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <div class="row g-2 mb-4">
      <div class="col-md-4">
        <select id="category" class="form-select">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="col-md-8">
        <input id="search" type="search" class="form-control" placeholder="Search products...">
      </div>
    </div>

    <div id="product-detail" class="card border-primary mb-4" hidden></div>

    <div id="catalog-list" class="row g-3"></div>
  </main>

  <script src="../app.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
