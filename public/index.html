<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Campus Marketplace - everything you need for campus, in one place.">
  <title>Campus Marketplace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="theme.css" rel="stylesheet">
  <script src="color-mode.js"></script>
  <style>
    /* Product cards here are drawn by the shared app.js (<div class="card"><h3>..</h3><p>..</p></div>) */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .products .card {
      padding: 1.5rem;
    }
    .products .card h3 {
      font-size: 1.375rem;
      margin-bottom: 0.25rem;
    }
    .products .card p {
      margin: 0;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-glass sticky-top">
    <div class="container">
      <a class="navbar-brand" href="./">Campus Marketplace</a>
      <div id="nav" class="d-flex align-items-center gap-2">
        <a class="nav-link" href="catalog/">Catalog</a>
        <button type="button" class="btn icon-btn" data-theme-toggle></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1 class="hero-title">Campus Marketplace.</h1>
      <p class="hero-lead mb-4">Everything you need for campus, in one place.</p>
      <a class="btn btn-primary btn-lg" href="catalog/">Shop the catalog</a>
    </header>

    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <section id="app">
      <h2 class="mb-4">Products</h2>
      <div id="product-list" class="products"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Campus Marketplace &middot; ITCS333 group project</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
