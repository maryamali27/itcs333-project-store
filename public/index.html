<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Campus Marketplace - everything you need for campus, in one place.">
  <title>Campus Marketplace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link href="theme.css" rel="stylesheet">
  <script src="color-mode.js"></script>
</head>
<body>
  <nav class="navbar navbar-glass sticky-top">
    <div class="container">
      <a class="navbar-brand" href="./">Campus Marketplace</a>
      <div id="nav" class="d-flex align-items-center gap-2">
        <a class="nav-link" href="catalog/">Catalog</a>
        <button type="button" class="btn icon-btn" data-theme-toggle aria-label="Change theme"></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1 class="hero-title">Campus Marketplace.</h1>
      <p class="hero-lead mb-4">Everything you need for campus, in one place.</p>
      <div class="d-flex flex-wrap justify-content-center align-items-center gap-4">
        <a class="btn btn-primary" href="catalog/">Shop the catalog</a>
        <a class="link-more" href="catalog/">Browse categories<i class="bi bi-chevron-right ms-1" aria-hidden="true"></i></a>
      </div>
    </header>

    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <section id="app" aria-labelledby="latest-title">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <h2 id="latest-title" class="section-title mb-0">The latest. <span class="subtle">Take a look at what's new.</span></h2>
        <a class="link-more" href="catalog/">See all<i class="bi bi-chevron-right ms-1" aria-hidden="true"></i></a>
      </div>
      <section id="latest-list" class="shelf" aria-label="Latest products" tabindex="0"></section>
      <div class="paddles">
        <button type="button" id="shelf-prev" class="btn paddle" aria-label="Previous products" disabled>
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
        <button type="button" id="shelf-next" class="btn paddle" aria-label="Next products" disabled>
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Campus Marketplace &middot; ITCS333 group project</div>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
