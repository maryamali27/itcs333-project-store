<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Campus Marketplace - stationery, electronics and books for your courses.">
  <title>Campus Marketplace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="theme.css" rel="stylesheet">
  <script src="color-mode.js"></script>
</head>
<body>
  <nav class="navbar navbar-glass sticky-top">
    <div class="container">
      <a class="navbar-brand" href="./">Campus Marketplace</a>
      <div id="nav" class="d-flex align-items-center gap-2">
        <a class="nav-link" href="catalog/">Catalog</a>
        <button type="button" class="btn icon-btn" data-theme-toggle aria-label="Change theme"></button>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1 class="hero-title">Campus Marketplace</h1>
      <p class="hero-lead mb-4">Stationery, electronics and books for your courses.</p>
      <a class="btn btn-primary" href="catalog/">Browse the catalog</a>
    </header>

    <div id="error-banner" class="alert alert-danger" role="alert" style="display: none;"></div>

    <section class="mb-5" aria-labelledby="categories-title">
      <h2 id="categories-title" class="section-title mb-4">Shop by category</h2>
      <div id="category-list" class="d-flex flex-wrap gap-3"></div>
    </section>

    <section id="app" aria-labelledby="latest-title">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
        <h2 id="latest-title" class="section-title mb-0">New in the catalog</h2>
        <a href="catalog/">See all <span aria-hidden="true">›</span></a>
      </div>
      <section id="latest-list" class="shelf" aria-label="Latest products" tabindex="0"></section>
      <div class="d-flex justify-content-end gap-2">
        <button type="button" id="shelf-prev" class="btn icon-btn paddle" aria-label="Previous products" disabled>
          <span aria-hidden="true">‹</span>
        </button>
        <button type="button" id="shelf-next" class="btn icon-btn paddle" aria-label="Next products" disabled>
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Campus Marketplace &middot; ITCS333 group project</div>
  </footer>

  <script src="app.js"></script>
  <script type="module" src="home.js"></script>
</body>
</html>
